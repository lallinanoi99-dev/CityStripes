name = "my-city-stripes-worker"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Comma-separated list of sites allowed to call this Worker (localhost is always allowed for dev)
ALLOWED_ORIGINS = "https://YOUR_DOMAIN,https://YOUR_GITHUB_USER.github.io"

# Optional per-IP daily limit on uncached city fetches (cached cities are unlimited).
# Create with: npx wrangler kv namespace create RATE — then paste the id below and uncomment.
# [[kv_namespaces]]
# binding = "RATE"
# id = "PASTE_KV_ID"

[observability]
enabled = false
